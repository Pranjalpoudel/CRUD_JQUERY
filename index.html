<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1 class="app-title">Gym Workout Tracker</h1>
        </header>
        <main class="dashboard-grid">
            <section class="panel panel-tracker" id="tracker-panel">
                <div class="panel-header">Add New Exercise</div>
                <div class="panel-body">
                    <form id="exercise-form" class="exercise-form">
                        <div class="form-group">
                            <label for="exercise-name">Exercise Name</label>
                            <input type="text" id="exercise-name" required placeholder="e.g. Bench Press">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="exercise-sets">Sets</label>
                                <input type="number" id="exercise-sets" min="1" required placeholder="3">
                            </div>
                            <div class="form-group">
                                <label for="exercise-reps">Reps</label>
                                <input type="number" id="exercise-reps" min="1" required placeholder="8">
                            </div>
                            <div class="form-group">
                                <label for="exercise-weight">Weight (kg)</label>
                                <input type="number" id="exercise-weight" min="0" step="0.5" required placeholder="60">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="exercise-date">Date</label>
                            <input type="date" id="exercise-date" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="add-exercise-btn">Add Exercise</button>
                    </form>
                </div>
                <div class="panel-header panel-header-secondary">Exercise List</div>
                <div class="panel-body">
                    <div class="table-wrap">
                        <table class="exercise-table">
                            <thead>
                                <tr>
                                    <th>Exercise</th>
                                    <th>Sets</th>
                                    <th>Reps</th>
                                    <th>Weight (kg)</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="exercise-tbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <section class="panel panel-chart" id="chart-panel">
            </section>
            <section class="panel panel-plans" id="plans-panel">
                <div class="panel-header">Workout Plans</div>
                <div class="panel-body">
                    <form id="plan-form" class="plan-form">
                        <div class="form-group">
                            <label for="plan-name">Plan Name</label>
                            <input type="text" id="plan-name" required placeholder="e.g. Push Day">
                        </div>
                        <div class="plan-exercises-wrap">
                            <label>Exercises</label>
                            <div id="plan-exercises-list"></div>
                            <button type="button" class="btn btn-secondary" id="add-plan-exercise">+ Add Exercise</button>
                        </div>
                        <input type="hidden" id="plan-edit-id" value="">
                        <button type="submit" class="btn btn-primary" id="save-plan-btn">Save Plan</button>
                    </form>
                    <div class="plans-list-wrap">
                        <label class="plans-list-label">Saved Plans</label>
                        <ul id="plans-list"></ul>
                    </div>
                </div>
            </section>
            <section class="panel panel-pr" id="pr-panel">
            </section>
            <section class="panel panel-bmi" id="bmi-panel">
            </section>
            <section class="panel panel-today" id="today-panel">
                <div class="panel-header">Today's Workout</div>
                <div class="panel-body">
                    <div class="form-group">
                        <label for="today-plan-select">Select Plan</label>
                        <select id="today-plan-select">
                            <option value="">-- Choose a plan --</option>
                        </select>
                    </div>
                    <div id="today-workout-cards" class="today-workout-cards"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
