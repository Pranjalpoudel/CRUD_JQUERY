<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <h1 class="app-title">Gym Workout Tracker</h1>
        </header>
        <main class="dashboard-grid">
            <section class="panel panel-tracker" id="tracker-panel">
                <!-- Exercise form and list - Commit 4+ -->
            </section>
            <section class="panel panel-chart" id="chart-panel">
                <!-- Progress chart - Commit 19+ -->
            </section>
            <section class="panel panel-pr" id="pr-panel">
                <!-- Personal Records - Commit 15+ -->
            </section>
            <section class="panel panel-bmi" id="bmi-panel">
                <!-- BMI Calculator - Commit 17+ -->
            </section>
            <section class="panel panel-today" id="today-panel">
                <!-- Today's Workout - Commit 14+ -->
            </section>
        </main>
    </div>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
